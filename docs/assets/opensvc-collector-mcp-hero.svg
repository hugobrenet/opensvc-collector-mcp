<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenSVC Collector MCP animated architecture</title>
  <desc id="desc">Animated architecture hero showing an AI agent discovering typed OpenSVC Collector MCP tools, calling Collector API read-only data, and returning structured results.</desc>

  <defs>
    <radialGradient id="backgroundGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#183053"/>
      <stop offset="45%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#060914"/>
    </radialGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hubFill" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="aiFill" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <linearGradient id="collectorFill" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#67e8f9" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.48"/>
    </filter>

    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.07"/>
    </pattern>

    <path id="aiToMcpPath" d="M365 440 C515 330 615 350 705 425"/>
    <path id="mcpToCollectorPath" d="M900 425 C995 350 1115 335 1242 440"/>
    <path id="collectorToMcpPath" d="M1242 503 C1090 620 990 612 895 507"/>
    <path id="mcpToAiPath" d="M705 507 C610 620 500 600 365 503"/>

    <style>
      .title {
        font: 700 42px Arial, Helvetica, sans-serif;
        letter-spacing: 0;
        fill: #f8fafc;
      }

      .subtitle {
        font: 400 20px Arial, Helvetica, sans-serif;
        letter-spacing: 0;
        fill: #cbd5e1;
      }

      .label {
        font: 700 21px Arial, Helvetica, sans-serif;
        letter-spacing: 0;
        fill: #f8fafc;
      }

      .small {
        font: 400 15px Arial, Helvetica, sans-serif;
        letter-spacing: 0;
        fill: #cbd5e1;
      }

      .micro {
        font: 700 13px Arial, Helvetica, sans-serif;
        letter-spacing: 0;
        fill: #dbeafe;
      }

      .domain {
        font: 700 14px Arial, Helvetica, sans-serif;
        letter-spacing: 0;
        fill: #e0f2fe;
      }

      .terminal {
        font: 700 14px "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        letter-spacing: 0;
        fill: #a7f3d0;
      }

      .muted-stroke {
        stroke: #64748b;
        stroke-opacity: 0.26;
      }

      .flow {
        fill: none;
        stroke: url(#lineGradient);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 8 16;
        animation: dash 3.4s linear infinite;
      }

      .ring {
        fill: none;
        stroke: #67e8f9;
        stroke-width: 2;
        stroke-opacity: 0.5;
        transform-origin: 800px 465px;
        animation: rotate 18s linear infinite;
      }

      .ring.reverse {
        stroke: #a7f3d0;
        stroke-dasharray: 14 18;
        animation-direction: reverse;
        animation-duration: 24s;
      }

      .pulse {
        animation: pulse 2.8s ease-in-out infinite;
        transform-origin: center;
      }

      .scan {
        animation: scan 3.2s ease-in-out infinite;
      }

      .domain-chip {
        animation: glow 6s ease-in-out infinite;
      }

      .delay-1 { animation-delay: 0.4s; }
      .delay-2 { animation-delay: 0.8s; }
      .delay-3 { animation-delay: 1.2s; }
      .delay-4 { animation-delay: 1.6s; }
      .delay-5 { animation-delay: 2.0s; }
      .delay-6 { animation-delay: 2.4s; }
      .delay-7 { animation-delay: 2.8s; }
      .delay-8 { animation-delay: 3.2s; }

      @keyframes dash {
        to { stroke-dashoffset: -96; }
      }

      @keyframes rotate {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.035); }
      }

      @keyframes scan {
        0%, 100% { transform: translateY(-42px); opacity: 0; }
        18%, 72% { opacity: 0.78; }
        50% { transform: translateY(46px); opacity: 0.95; }
      }

      @keyframes glow {
        0%, 100% { opacity: 0.66; }
        45%, 55% { opacity: 1; filter: drop-shadow(0 0 8px #22d3ee); }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow, .ring, .pulse, .scan, .domain-chip {
          animation: none;
        }
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#backgroundGlow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g opacity="0.36">
    <circle cx="170" cy="145" r="2" fill="#bfdbfe"/>
    <circle cx="276" cy="694" r="2" fill="#67e8f9"/>
    <circle cx="456" cy="130" r="1.8" fill="#a7f3d0"/>
    <circle cx="1012" cy="128" r="2" fill="#bfdbfe"/>
    <circle cx="1404" cy="728" r="2.2" fill="#67e8f9"/>
    <circle cx="1336" cy="184" r="1.8" fill="#a7f3d0"/>
    <circle cx="712" cy="760" r="2" fill="#bfdbfe"/>
  </g>

  <text x="92" y="88" class="title">OpenSVC Collector MCP</text>
  <text x="92" y="124" class="subtitle">Typed FastMCP tools that let AI agents read OpenSVC Collector safely and predictably.</text>

  <g transform="translate(112 350)" filter="url(#softShadow)">
    <rect width="300" height="190" rx="22" fill="url(#aiFill)" stroke="#67e8f9" stroke-opacity="0.35"/>
    <circle cx="58" cy="62" r="28" fill="#ffffff" opacity="0.12"/>
    <path d="M46 62c0-18 24-30 40-14 11 11 8 31-7 39h-31c-14-8-17-25-2-25z" fill="#e0f2fe" opacity="0.95"/>
    <path d="M48 87h34" stroke="#312e81" stroke-width="5" stroke-linecap="round"/>
    <text x="104" y="58" class="label">AI Agent</text>
    <text x="104" y="87" class="small">Natural-language intent</text>
    <rect x="28" y="122" width="244" height="38" rx="12" fill="#020617" opacity="0.42"/>
    <text x="45" y="146" class="terminal">find unhealthy services</text>
  </g>

  <g transform="translate(1188 350)" filter="url(#softShadow)">
    <rect width="300" height="190" rx="22" fill="url(#collectorFill)" stroke="#86efac" stroke-opacity="0.36"/>
    <circle cx="58" cy="62" r="28" fill="#ffffff" opacity="0.12"/>
    <rect x="39" y="42" width="39" height="43" rx="8" fill="#dcfce7"/>
    <path d="M49 55h19M49 67h19M49 79h12" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
    <text x="104" y="58" class="label">Collector API</text>
    <text x="104" y="87" class="small">Read-only infrastructure data</text>
    <rect x="28" y="122" width="244" height="38" rx="12" fill="#020617" opacity="0.38"/>
    <text x="45" y="146" class="terminal">GET /init/rest/api/...</text>
  </g>

  <path class="flow" d="M365 440 C515 330 615 350 705 425"/>
  <path class="flow" d="M900 425 C995 350 1115 335 1242 440"/>
  <path class="flow" d="M1242 503 C1090 620 990 612 895 507"/>
  <path class="flow" d="M705 507 C610 620 500 600 365 503"/>

  <circle r="7" fill="#7dd3fc" filter="url(#neon)">
    <animateMotion dur="3.6s" repeatCount="indefinite">
      <mpath href="#aiToMcpPath"/>
    </animateMotion>
  </circle>
  <circle r="7" fill="#a7f3d0" filter="url(#neon)">
    <animateMotion dur="3.6s" begin="0.9s" repeatCount="indefinite">
      <mpath href="#mcpToCollectorPath"/>
    </animateMotion>
  </circle>
  <circle r="6" fill="#86efac" filter="url(#neon)">
    <animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite">
      <mpath href="#collectorToMcpPath"/>
    </animateMotion>
  </circle>
  <circle r="6" fill="#fef08a" filter="url(#neon)">
    <animateMotion dur="3.6s" begin="2.7s" repeatCount="indefinite">
      <mpath href="#mcpToAiPath"/>
    </animateMotion>
  </circle>

  <g>
    <circle cx="800" cy="465" r="214" class="ring"/>
    <circle cx="800" cy="465" r="246" class="ring reverse"/>
    <circle cx="800" cy="465" r="182" fill="url(#hubGlow)" class="pulse"/>
  </g>

  <g transform="translate(610 280)" filter="url(#softShadow)">
    <rect width="380" height="370" rx="32" fill="#08111f" stroke="#67e8f9" stroke-opacity="0.38"/>
    <rect x="26" y="26" width="328" height="88" rx="22" fill="url(#hubFill)" stroke="#a7f3d0" stroke-opacity="0.28"/>
    <text x="52" y="63" class="label">OpenSVC Collector MCP</text>
    <text x="52" y="93" class="small">FastMCP HTTP server</text>

    <g transform="translate(34 142)">
      <rect width="312" height="138" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.28"/>
      <text x="22" y="34" class="micro">BM25 tool discovery</text>
      <text x="22" y="67" class="terminal">search_tools("service health")</text>
      <text x="22" y="100" class="terminal">call_tool(get_service_health)</text>
      <rect class="scan" x="14" y="68" width="284" height="3" rx="2" fill="#67e8f9" opacity="0.75"/>
    </g>

    <g transform="translate(34 303)">
      <rect width="150" height="38" rx="12" fill="#0f766e" opacity="0.88"/>
      <text x="22" y="25" class="micro">Pydantic I/O</text>
      <rect x="164" width="148" height="38" rx="12" fill="#1d4ed8" opacity="0.82"/>
      <text x="190" y="25" class="micro">Read-only</text>
    </g>
  </g>

  <g class="domain-chip delay-1">
    <rect x="642" y="201" width="98" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="666" y="224" class="domain">Nodes</text>
  </g>
  <g class="domain-chip delay-2">
    <rect x="762" y="185" width="116" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="783" y="208" class="domain">Services</text>
  </g>
  <g class="domain-chip delay-3">
    <rect x="899" y="216" width="133" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="919" y="239" class="domain">Compliance</text>
  </g>
  <g class="domain-chip delay-4">
    <rect x="1035" y="314" width="88" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="1058" y="337" class="domain">Apps</text>
  </g>
  <g class="domain-chip delay-5">
    <rect x="1050" y="575" width="90" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="1070" y="598" class="domain">Arrays</text>
  </g>
  <g class="domain-chip delay-6">
    <rect x="873" y="708" width="88" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="895" y="731" class="domain">Disks</text>
  </g>
  <g class="domain-chip delay-7">
    <rect x="653" y="708" width="105" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="675" y="731" class="domain">Clusters</text>
  </g>
  <g class="domain-chip delay-8">
    <rect x="483" y="575" width="88" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="507" y="598" class="domain">Tags</text>
  </g>
  <g class="domain-chip">
    <rect x="481" y="314" width="90" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="504" y="337" class="domain">Users</text>
  </g>

  <g transform="translate(92 782)">
    <rect width="1416" height="66" rx="24" fill="#020617" opacity="0.58" stroke="#334155" stroke-opacity="0.6"/>
    <text x="32" y="28" class="micro">108 typed Collector tools + BM25 discovery</text>
    <text x="32" y="51" class="small">Nodes, services, compliance, users, tags, apps, arrays, disks, and clusters exposed as predictable read-only MCP contracts.</text>
    <text x="1082" y="41" class="terminal">intent -> search_tools -> call_tool -> structured result</text>
  </g>
</svg>
